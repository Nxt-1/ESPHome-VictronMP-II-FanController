esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "3 MultiPlus-II fan requests -> one shared Noctua fan command"
  on_boot:
    priority: 600
    then:
      # Raw 0% = GPIO LOW = BC547s OFF = PWM lines released = full fans.
      - output.set_level:
          id: fan_pwm_raw
          level: 0%

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  level: ${log_level}

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      then:
        - logger.log: "OTA update started"

    on_end:
      then:
        - logger.log: "OTA update completed"

    on_error:
      then:
        - logger.log:
            format: "OTA update failed with error code %d"
            args: ["x"]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s
  power_save_mode: none

# Shared 25 kHz PWM.
# GPIO22 / D4 drives three 4.7k base resistors, one per BC547B.
# The transistor stages invert the logic:
#   GPIO LOW  -> BC547 OFF -> fan PWM released HIGH -> 100% fan
#   GPIO HIGH -> BC547 ON  -> fan PWM LOW           -> 0% fan
output:
  - platform: ledc
    id: fan_pwm_raw
    pin: GPIO22
    frequency: 25kHz
    channel: 0

sensor:
  # Three isolated ~25 Hz Victron power-PWM request inputs.
  - platform: duty_cycle
    id: mp1_request
    name: "MP1 Victron Fan Request"
    pin:
      number: GPIO1
      mode:
        input: true
      inverted: true
    update_interval: 500ms
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - clamp:
          min_value: 0
          max_value: 100
      # Quantize the rather coarse Victron fan PWM to 5% steps.
      - lambda: return roundf(x / 5.0f) * 5.0f;

  - platform: duty_cycle
    id: mp2_request
    name: "MP2 Victron Fan Request"
    pin:
      number: GPIO2
      mode:
        input: true
      inverted: true
    update_interval: 500ms
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - clamp:
          min_value: 0
          max_value: 100
      # Quantize the rather coarse Victron fan PWM to 5% steps.
      - lambda: return roundf(x / 5.0f) * 5.0f;

  - platform: duty_cycle
    id: mp3_request
    name: "MP3 Victron Fan Request"
    pin:
      number: GPIO21
      mode:
        input: true
      inverted: true
    update_interval: 500ms
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - clamp:
          min_value: 0
          max_value: 100
      # Quantize the rather coarse Victron fan PWM to 5% steps.
      - lambda: return roundf(x / 5.0f) * 5.0f;

  - platform: template
    id: highest_request
    name: "Highest Victron Fan Request"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 500ms
    lambda: |-
      if (isnan(id(mp1_request).state) ||
          isnan(id(mp2_request).state) ||
          isnan(id(mp3_request).state)) {
        return NAN;
      }
      return std::max(id(mp1_request).state,
             std::max(id(mp2_request).state, id(mp3_request).state));

  # Noctua tach: open collector, two pulses/revolution.
  # External 1k pull-up to 3.3 V on each tach line.
  - platform: pulse_meter
    id: mp1_rpm
    name: "MP1 Fan RPM"
    pin:
      number: GPIO23
      mode:
        input: true
    internal_filter: 100us
    timeout: 2s
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - multiply: 0.5
      - throttle_average: 1s

  - platform: pulse_meter
    id: mp2_rpm
    name: "MP2 Fan RPM"
    pin:
      number: GPIO17
      mode:
        input: true
    internal_filter: 100us
    timeout: 2s
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - multiply: 0.5
      - throttle_average: 1s

  - platform: pulse_meter
    id: mp3_rpm
    name: "MP3 Fan RPM"
    pin:
      number: GPIO18
      mode:
        input: true
    internal_filter: 100us
    timeout: 2s
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - multiply: 0.5
      - throttle_average: 1s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

number:
  # Auto-mode baseline. A 0% Victron request produces this fan speed;
  # a 100% Victron request still produces 100% fan speed.
  - platform: template
    id: baseline_fan_speed
    name: "Baseline Fan Speed"
    min_value: 20
    max_value: 60
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 30
    entity_category: config

  # Live shared command + manual control slider.
  # A user change automatically selects Manual mode.
  - platform: template
    id: fan_speed
    name: "Fan Speed"
    min_value: 20
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true
    restore_value: false
    initial_value: 100
    set_action:
      - select.set:
          id: fan_mode
          option: "Manual"
      - lambda: |-
          const float command = std::max(20.0f, std::min(100.0f, x));
          id(fan_pwm_raw).set_level(1.0f - command / 100.0f);

select:
  - platform: template
    id: fan_mode
    name: "Fan Mode"
    options:
      - "Auto"
      - "Manual"
      - "Full Speed"
    optimistic: true
    restore_value: false
    initial_option: "Auto"

# Local control loop. HA/Wi-Fi are not required for cooling.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          float command = 100.0f;

          // Auto mode uses fast attack / slow release:
          // - any increase in Victron request is followed immediately;
          // - decreases are limited to one 5% request step every 10 seconds.
          // This also suppresses short downward glitches in the rather coarse
          // Victron fan PWM signal.
          static float held_request = 0.0f;
          static uint32_t last_release_ms = 0;
          static bool auto_was_active = false;

          if (id(fan_mode).current_option() == "Manual") {
            auto_was_active = false;
            if (!isnan(id(fan_speed).state)) {
              command = id(fan_speed).state;
            }
          } else if (id(fan_mode).current_option() == "Full Speed") {
            auto_was_active = false;
            command = 100.0f;
          } else {
            // Auto mode. Until all three request inputs and the baseline are
            // valid, fail to 100%.
            if (!isnan(id(mp1_request).state) &&
                !isnan(id(mp2_request).state) &&
                !isnan(id(mp3_request).state) &&
                !isnan(id(baseline_fan_speed).state)) {

              const float request = std::max(
                  id(mp1_request).state,
                  std::max(id(mp2_request).state,
                           id(mp3_request).state));

              const uint32_t now = millis();

              // Entering Auto starts from the current request rather than a
              // stale value left over from an earlier Auto session.
              if (!auto_was_active) {
                held_request = request;
                last_release_ms = now;
                auto_was_active = true;
              } else if (request > held_request) {
                // Fast attack: increases are immediate.
                held_request = request;
                last_release_ms = now;
              } else if (request < held_request) {
                // Slow release: drop at most one 5% step every 10 seconds.
                if ((uint32_t) (now - last_release_ms) >= 10000U) {
                  held_request = std::max(request, held_request - 5.0f);
                  last_release_ms = now;
                }
              } else {
                // A stable request restarts the release timer so a future
                // decrease must persist before airflow is reduced.
                last_release_ms = now;
              }

              const float baseline = std::max(
                  20.0f, std::min(100.0f, id(baseline_fan_speed).state));

              // Rescale the held 0...100% Victron request onto
              // baseline...100%.
              // Example: 50% baseline + 50% request = 75% command.
              command = baseline +
                        (held_request / 100.0f) * (100.0f - baseline);

              // Keep the actual commanded value to whole-percent steps.
              command = roundf(command);
            } else {
              auto_was_active = false;
            }
          }

          command = std::max(20.0f, std::min(100.0f, command));

          id(fan_pwm_raw).set_level(1.0f - command / 100.0f);

          if (isnan(id(fan_speed).state) ||
              fabsf(id(fan_speed).state - command) >= 0.5f) {
            id(fan_speed).publish_state(command);
          }

binary_sensor:
  # 20% PWM is nominally ~700 rpm on this Noctua model.
  # 250 rpm is intentionally a stall/failure threshold, not a performance limit.
  - platform: template
    name: "MP1 Fan Fault"
    device_class: problem
    lambda: |-
      if (isnan(id(fan_speed).state) || isnan(id(mp1_rpm).state)) return false;
      return id(fan_speed).state >= 20.0f && id(mp1_rpm).state < 250.0f;
    filters:
      - delayed_on: 5s
      - delayed_off: 2s

  - platform: template
    name: "MP2 Fan Fault"
    device_class: problem
    lambda: |-
      if (isnan(id(fan_speed).state) || isnan(id(mp2_rpm).state)) return false;
      return id(fan_speed).state >= 20.0f && id(mp2_rpm).state < 250.0f;
    filters:
      - delayed_on: 5s
      - delayed_off: 2s

  - platform: template
    name: "MP3 Fan Fault"
    device_class: problem
    lambda: |-
      if (isnan(id(fan_speed).state) || isnan(id(mp3_rpm).state)) return false;
      return id(fan_speed).state >= 20.0f && id(mp3_rpm).state < 250.0f;
    filters:
      - delayed_on: 5s
      - delayed_off: 2s
